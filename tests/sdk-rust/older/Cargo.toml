[package]
name = "azemu-sdk-rust-tests-older"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The versions that projects are often pinned to: azure_core, azure_identity and azure_storage_blob 1.0.0, and azure_data_cosmos 0.36.0
# (before the 1.0 rewrite of the Cosmos crate: no control-plane calls). They cannot share a dependency graph with the 1.1 crates of
# the main project, so they live in a project of their own, like `beta`.
[workspace]

[dependencies]
azure_core = "=1.0.0"
azure_identity = "=1.0.0"
azure_storage_blob = "=1.0.0"
azure_data_cosmos = { version = "=0.36.0", features = ["key_auth"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
async-trait = "0.1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
