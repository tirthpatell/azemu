[package]
name = "azemu-sdk-rust-tests-beta"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The newest (beta) releases of the Azure SDK for Rust crates. They need azure_core 1.2.0-beta, which cannot be in the same
# dependency graph as azure_data_cosmos 1.1.0-beta.2 (needs azure_core 1.1), so they live in this second project.
[workspace]

[dependencies]
azure_core = "=1.2.0-beta.2"
azure_identity = "=1.1.0-beta.2"
azure_storage_blob = "=1.2.0-beta.1"
azure_security_keyvault_secrets = "=1.1.0-beta.1"
azure_messaging_eventhubs = { version = "=0.16.0", features = ["fe2o3_amqp_ws_rustls"] }
azure_core_amqp = "=1.2.0-beta.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
async-trait = "0.1"
url = "2"
base64 = "0.22"
rand = "0.9"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
