[package]
name = "azemu-monitor"
description = "azemu: monitor service (a sink for Application Insights and Azure Monitor telemetry)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "azemu-monitor"
path = "src/main.rs"

[dependencies]
azemu-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
serde.workspace = true
# `raw_value`: an item is kept as the text it came as (`store.rs`) and a body is read one item at a time (`breeze.rs`).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
# Same version and features as the Event Hubs and Kafka crates, so the workspace compiles it once.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
azemu-core = { workspace = true, features = ["testing"] }
tokio.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
