[package]
name = "azemu-keyvault"
description = "azemu: Azure Key Vault service (secrets, keys, certificates)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "azemu-keyvault"
path = "src/main.rs"

[dependencies]
azemu-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
uuid.workspace = true
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
k256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
sha1 = "0.11.0"
x509-parser = "0.18.1"
p12-keystore = "0.4.1"
time.workspace = true

[dev-dependencies]
azemu-core = { workspace = true, features = ["testing"] }
tokio.workspace = true
