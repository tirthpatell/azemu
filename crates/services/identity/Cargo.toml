[package]
name = "azemu-identity"
description = "azemu: identity service (managed identity endpoints and a Microsoft Entra ID token endpoint)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "azemu-identity"
path = "src/main.rs"

[dependencies]
azemu-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
uuid.workspace = true
percent-encoding.workspace = true
# Same version and features as the keyvault crate, so the workspace compiles rsa once.
rsa = { version = "0.10.0", features = ["pkcs1v15"] }

[dev-dependencies]
azemu-core = { workspace = true, features = ["testing"] }
tokio.workspace = true
