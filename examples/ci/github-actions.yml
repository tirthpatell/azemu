# GitHub Actions: the emulator runs as a service container of the job, with its ports published to the runner. The
# tests reach it on localhost, on the standard ports (a path-style address, http://localhost:10000/devstoreaccount1).
# `examples/ci/check.sh github` runs the same arrangement on one machine with Docker.
#
# Pin the image to a version (`ghcr.io/tirthpatell/azemu:0.1.0`) rather than `latest`, so that a new release does not change your tests.
# The Python check below is only a stand-in for your tests. For a Rust project see github-actions-rust.yml.
name: integration-tests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      azemu:
        image: ghcr.io/tirthpatell/azemu:0.1.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10010:10010
    steps:
      - uses: actions/checkout@v7
      - run: pip install azure-storage-blob azure-storage-queue azure-keyvault-secrets
      - run: python examples/common/check.py
        env:
          AZEMU_HOST: localhost
