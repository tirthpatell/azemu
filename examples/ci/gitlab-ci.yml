# GitLab CI: the emulator runs as a service of the job. The job reaches it by the alias, on the standard ports.
# `examples/ci/check.sh gitlab` runs the same arrangement on one machine.
#
# What works today: the arrangement, run on one machine with Docker by check.sh. This file was not run on a GitLab server.
# The image is not published yet. Until the first release, build it from the root Dockerfile (`docker build -t azemu:latest .`) and push it
# to your registry (the `name:` below); `Dockerfile.dev` builds a quick local image around a binary you made and works the same way.
# After the first release the image is ghcr.io/tirthpatell/azemu:<version>, which a runner can pull directly.
# The Python check below is only a stand-in for your tests.
integration-tests:
  image: python:3.12-slim
  services:
    - name: $CI_REGISTRY_IMAGE/azemu:latest
      alias: azemu
  variables:
    AZEMU_TLS_NAME: azemu       # a certificate for https://azemu:...
    AZEMU_HOST: azemu
  script:
    - pip install azure-storage-blob azure-storage-queue azure-keyvault-secrets
    - python examples/common/check.py        # replace with your own tests; they use azemu:10000, azemu:10001, https://azemu:10010
