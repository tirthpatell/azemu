# GitLab CI: the emulator runs as a service of the job. The job reaches it by the alias, on the standard ports.
# `examples/ci/check.sh gitlab` runs the same arrangement on one machine.
#
# The image is ghcr.io/tirthpatell/azemu:<version>, which a runner can pull directly. Pin it to a version rather than `latest`. To test a
# build of your own, build the root Dockerfile (`docker build -t azemu:latest .`), push it to your registry and name it below.
# The Python check below is only a stand-in for your tests.
integration-tests:
  image: python:3.12-slim
  services:
    - name: ghcr.io/tirthpatell/azemu:0.1.0
      alias: azemu
  variables:
    AZEMU_TLS_NAME: azemu       # a certificate for https://azemu:...
    AZEMU_HOST: azemu
  script:
    - pip install azure-storage-blob azure-storage-queue azure-keyvault-secrets
    - python examples/common/check.py        # replace with your own tests; they use azemu:10000, azemu:10001, https://azemu:10010
