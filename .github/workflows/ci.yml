# Continuous integration of azemu on GitHub's hosted runners (4 cores, 16 GB; no self-hosted runner is needed).
#
#   every pull request and every push to main:   formatting, clippy, the crates' own tests, a release build with a smoke test,
#                                                the container test, licences, the Python SDK suites (all but Service Bus and
#                                                Event Hubs), and the Go and Rust SDK suites
#   only when started by hand (Run workflow):    the two slow Python suites (Service Bus, Event Hubs; about half an hour
#                                                each), the JavaScript, Java and .NET SDK suites, and the Rust tests on
#                                                macOS (macos-rust: not part of ci-passed)
#
# Nothing runs on a schedule.
#
# The replay of Microsoft's recordings is another workflow (replay.yml), because it needs the recordings, which are fetched
# from Microsoft's repositories (tools/fetch-refs.py). Releases are release.yml.
#
# No secrets: only the GITHUB_TOKEN that every run has, read-only here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # bash with -eo pipefail: `cmd | tee file` fails when cmd fails

# A new push to a pull request or to main cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1" # what the Dockerfile builds with and what the tests were run with
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4" # a hosted runner has 4 cores
  RUST_BACKTRACE: "1"
  PYTHON_VERSION: "3.13"

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      # rustfmt.toml at the root holds the style; the Rust SDK suites and the example are projects of their own
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path tests/sdk-rust/Cargo.toml
      - run: cargo fmt --all --check --manifest-path tests/sdk-rust/beta/Cargo.toml
      - run: cargo fmt --all --check --manifest-path tests/sdk-rust/older/Cargo.toml
      - run: cargo fmt --all --check --manifest-path examples/rust/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy, every target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy, without the optional features
        run: cargo clippy -p azemu --locked --no-default-features -- -D warnings

  licences:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # licences, bans and sources must hold; advisories are reported but do not stop a pull request (a new advisory
      # against an old dependency is not the pull request's fault)
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: THIRD-PARTY-LICENSES.md is up to date
        run: |
          cargo fetch --locked
          python3 tools/release/third_party_licenses.py > "$RUNNER_TEMP/third-party.md"
          if ! diff -q THIRD-PARTY-LICENSES.md "$RUNNER_TEMP/third-party.md"; then
            echo "::error file=THIRD-PARTY-LICENSES.md::out of date: run python3 tools/release/third_party_licenses.py > THIRD-PARTY-LICENSES.md"
            exit 1
          fi

  unit-tests:
    name: Crate tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      # Some tests assert on wall-clock time (a request must not wait for a save, a limit must stop a script quickly), and a
      # shared runner can stall for a moment. A failed run is repeated once: a test that fails twice is a real failure.
      - name: cargo test (repeated once if it fails)
        run: |
          cargo test --workspace --locked --no-fail-fast || {
            echo "::warning::crate tests failed once; running them again"
            cargo test --workspace --locked --no-fail-fast
          }

  build:
    name: Release build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p azemu
      - name: smoke test (start, health, a blob, a Cosmos stored procedure, stop)
        run: python3 tools/release/smoke_test.py target/release/azemu --expect-commit any
      - run: mkdir dist && cp target/release/azemu dist/azemu
      - uses: actions/upload-artifact@v7
        with:
          name: azemu-linux-x86_64
          path: dist/azemu
          retention-days: 3
          if-no-files-found: error

  python-suites:
    name: Python SDK suites (fast ones)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/sdk-python/requirements.txt
      - run: pip install -r tests/sdk-python/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: azemu-linux-x86_64
          path: dist
      - run: chmod +x dist/azemu
      # every suite but servicebus and eventhubs (the slow-suites job below)
      - name: run the suites
        run: |
          suites() {
            python tests/run_sdk_suites.py --bin dist/azemu --jobs 4 \
              --only appconfig --only arm --only blob --only cosmos --only datalake --only eventgrid --only identity \
              --only kafka --only keyvault --only persistence --only queue --only seed --only storage_events --only table \
              | tee "$RUNNER_TEMP/python-suites.txt"
          }
          suites || { echo "::warning::the Python suites failed once; running them again"; suites; }
      - name: summary
        if: always()
        run: |
          { echo '### Python SDK suites (fast ones)'; echo '```'; cat "$RUNNER_TEMP/python-suites.txt" 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Container test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: azemu-linux-x86_64
          path: dist
      - run: chmod +x dist/azemu
      # puts the binary into a small image (Dockerfile.dev), runs it next to a Python client on a Docker network and reaches
      # eleven services by name on the standard ports
      - run: tests/container/run.sh dist/azemu

  # ---- not on pull requests: the long suites ------------------------------------------------------------------------

  python-slow:
    name: Python SDK suite ${{ matrix.suite }} (slow)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [servicebus, eventhubs]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/sdk-python/requirements.txt
      - run: pip install -r tests/sdk-python/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: azemu-linux-x86_64
          path: dist
      - run: chmod +x dist/azemu
      - name: run the suite
        run: python tests/run_sdk_suites.py --bin dist/azemu --jobs 4 --only ${{ matrix.suite }} | tee "$RUNNER_TEMP/suite.txt"
      - name: summary
        if: always()
        run: |
          { echo '### Python SDK suite ${{ matrix.suite }}'; echo '```'; cat "$RUNNER_TEMP/suite.txt" 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  sdk-js:
    name: JavaScript SDK suite
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('tests/sdk-js/package.json', 'tests/sdk-js/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: install the SDK packages
        run: .github/scripts/install-js-suite.sh
      - uses: actions/download-artifact@v8
        with:
          name: azemu-linux-x86_64
          path: dist
      - run: chmod +x dist/azemu
      - name: run the suite
        working-directory: tests/sdk-js
        env:
          AZEMU_BIN: ${{ github.workspace }}/dist/azemu
          JOBS: "3"
        run: npm test

  sdk-go:
    name: Go SDK suite
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/sdk-go/go.mod
          cache-dependency-path: tests/sdk-go/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: azemu-linux-x86_64
          path: dist
      - run: chmod +x dist/azemu
      - name: run the suite
        working-directory: tests/sdk-go
        env:
          AZEMU_BIN: ${{ github.workspace }}/dist/azemu
        run: |
          go test -count=1 -p 3 ./... || {
            echo "::warning::the Go suite failed once; running it again"
            go test -count=1 -p 3 ./...
          }

  sdk-java:
    name: Java SDK suite
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: tests/sdk-java/pom.xml
      - uses: actions/download-artifact@v8
        with:
          name: azemu-linux-x86_64
          path: dist
      - run: chmod +x dist/azemu
      # run.sh uses Maven from the PATH (the runner has it)
      - run: mvn --version
      - name: run the suite
        working-directory: tests/sdk-java
        env:
          AZEMU_BIN: ${{ github.workspace }}/dist/azemu
        run: ./run.sh

  sdk-dotnet:
    name: .NET SDK suite
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('tests/sdk-dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: azemu-linux-x86_64
          path: dist
      - run: chmod +x dist/azemu
      # run.sh uses the .NET SDK from the PATH (setup-dotnet put it there)
      - run: dotnet --version
      - name: run the suite
        env:
          AZEMU_BIN: ${{ github.workspace }}/dist/azemu
        run: tests/sdk-dotnet/run.sh

  sdk-rust:
    name: Rust SDK suite
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tests/sdk-rust
            tests/sdk-rust/beta
            tests/sdk-rust/older
      - uses: actions/download-artifact@v8
        with:
          name: azemu-linux-x86_64
          path: dist
      - run: chmod +x dist/azemu
      - name: run the suite (stable SDK crates, then the beta crates, then the older versions)
        env:
          AZEMU_BIN: ${{ github.workspace }}/dist/azemu
        run: |
          suite() {
            (cd tests/sdk-rust && cargo test --no-fail-fast) &&
              (cd tests/sdk-rust/beta && cargo test --no-fail-fast) &&
              (cd tests/sdk-rust/older && cargo test --no-fail-fast)
          }
          suite || { echo "::warning::the Rust suite failed once; running it again"; suite; }

  # The Rust SDK crates on macOS, started by hand. There the TLS stack asks the Keychain and does not read SSL_CERT_FILE, so the
  # emulator's certificate authority is put in the System keychain (docs/rust.md, section 3). Not part of ci-passed.
  # Passed on macos-26-arm64 in November 2026.
  macos-rust:
    name: Rust SDK tests on macOS (by hand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      AZEMU_PORT: "4577"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests/sdk-rust
            examples/rust
      - run: cargo build --locked -p azemu
      - name: start azemu with a certificate directory that stays
        run: |
          certs="$RUNNER_TEMP/azemu-certs"
          mkdir -p "$certs" && chmod 700 "$certs"
          target/debug/azemu --port "$AZEMU_PORT" --cert-dir "$certs" > "$RUNNER_TEMP/azemu.out" 2> "$RUNNER_TEMP/azemu.log" &
          echo "$!" > "$RUNNER_TEMP/azemu.pid"
          for _ in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:$AZEMU_PORT/_azemu/health" > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$AZEMU_PORT/_azemu/health"
          echo "AZEMU_GATEWAY=http://127.0.0.1:$AZEMU_PORT" >> "$GITHUB_ENV"
          echo "AZEMU_CA_FILE=$certs/ca.pem" >> "$GITHUB_ENV"
      - name: trust the certificate authority in the System keychain
        run: sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$AZEMU_CA_FILE"
      # The tests reach the emulator by names such as acct.blob.core.localhost, which macOS resolves from version 26 on
      # (docs/install.md). Say so here instead of failing in the tests with a connection error.
      - name: names under .localhost resolve
        run: |
          if ! python3 -c 'import socket; socket.getaddrinfo("azemu-check.blob.core.localhost", 4577)'; then
            echo "::error::azemu-check.blob.core.localhost does not resolve on this runner ($(sw_vers -productVersion)); the tests need macOS 26 or newer, or a resolver for .localhost"
            exit 1
          fi
      - name: examples/rust (the testkit uses the emulator that is running)
        run: cargo test --manifest-path examples/rust/Cargo.toml
      - name: the Rust SDK suite, Blob, Cosmos DB and identity
        working-directory: tests/sdk-rust
        run: cargo test --test blob --test cosmos --test identity
      - name: azemu log
        if: always()
        run: tail -n 100 "$RUNNER_TEMP/azemu.log" || true
      - name: stop azemu (the runner is thrown away, so the keychain needs no clean-up)
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/azemu.pid")" 2>/dev/null || true

  # One job to name in branch protection: it passes when every job that ran on this event passed (a skipped job is fine).
  ci-passed:
    name: CI passed
    if: always()
    needs: [format, clippy, licences, unit-tests, build, python-suites, container, python-slow, sdk-js, sdk-go, sdk-java, sdk-dotnet, sdk-rust]
    runs-on: ubuntu-latest
    steps:
      - name: every job that ran succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          print("jobs that did not succeed:", bad if bad else "none")
          sys.exit(1 if bad else 0)'
